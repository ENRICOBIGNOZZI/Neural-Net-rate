name: Build paper figures

on:
  workflow_dispatch:
  push:
    paths:
      - 'figures/**'
      - 'requirements.txt'
      - '.github/workflows/figures.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate figures
        run: python figures/make_paper_figures.py --outdir figures/output
      - name: Upload figures
        uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: |
            figures/output/*.png
            figures/output/*.pdf
